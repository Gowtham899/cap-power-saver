# Project-wide Gradle settings
# This file must be placed in the android/ directory of your Capacitor project

# AndroidX Migration
android.useAndroidX=true
android.enableJetifier=true

# Build Performance
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Java Version Configuration
# Ensure Java 17 is used consistently
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64

# Android Build Tools
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# Disable Gradle warnings
org.gradle.warning.mode=all

# Enable configuration cache for better performance
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Disable unused resources to reduce APK size
android.enableResourceOptimizations=true