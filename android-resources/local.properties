# Android SDK location
# This file configures the Android SDK path for Gradle builds
# Replace the path below with your actual Android SDK installation path

# For Windows (common Android Studio installation path):
sdk.dir=C\:\\Users\\%USERNAME%\\AppData\\Local\\Android\\Sdk

# For macOS (uncomment and use this instead):
# sdk.dir=/Users/%USERNAME%/Library/Android/sdk

# For Linux (uncomment and use this instead):
# sdk.dir=/home/%USERNAME%/Android/Sdk

# Alternative: Set ANDROID_HOME environment variable instead of using this file
# The environment variable takes precedence over this file